name: CMake

# This is ment for Release builds

on:
  workflow_dispatch:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

# Needed to create/update GitHub Releases
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set version
      shell: bash
      run: |
        VERSION=$(git describe --tags --dirty  --long --always)
        TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "untagged-${GITHUB_SHA::7}")

        if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
          FILE_VERSION="${GITHUB_REF_NAME}"

          MINOR=$(echo "${GITHUB_REF_NAME}" | cut -d. -f2)

          if (( MINOR % 2 == 0 )); then
            IS_STABLE=true
          else
            IS_STABLE=false
          fi
        else
          BRANCH=$(git branch --show-current)
          FILE_VERSION="${BRANCH}-${TAG}"
          IS_STABLE=false
        fi

        echo "VERSION=$VERSION" >> "$GITHUB_ENV"
        echo "FILE_VERSION=$FILE_VERSION" >> "$GITHUB_ENV"
        echo "IS_STABLE=$IS_STABLE" >> "$GITHUB_ENV"

        echo "VERSION       = $VERSION"
        echo "TAG           = $TAG"
        echo "FILE_VERSION  = $FILE_VERSION"

        git status
        git describe --tags --dirty || echo "describe failed"

    - name: Build
      shell: bash
      run: |
        docker run --rm \
          -v ${{ github.workspace }}:/project \
          -w /project \
          espressif/idf:release-v5.4 \
          bash -c ". \$IDF_PATH/export.sh && \
            idf.py \
              -DFW_VERSION=\"${{ env.VERSION }}\" \
              -DCMAKE_BUILD_TYPE=Release \
              -DSDKCONFIG_DEFAULTS=\"sdkconfig.defaults;sdkconfig.defaults.release\" \
              build"

        echo "--- Inhalt von build/ nach Build ---"
        ls -lh build/
        
        mkdir -p artifacts
        cp build/xcvario_pure.elf artifacts/xcvario_pur-${{ env.FILE_VERSION }}.elf
        cp build/xcvario_pure.bin artifacts/xcvario_pur-${{ env.FILE_VERSION }}.bin
        gzip artifacts/xcvario_pur-${{ env.FILE_VERSION }}.elf
        
        echo "--- Inhalt von artifacts/ auf Host ---"
        ls -lh artifacts/

    - name: Upload binary & ELF
      uses: actions/upload-artifact@v4
      with:
        name: XCVarioPur-${{ env.FILE_VERSION }}
        path: artifacts/*

    - name: Publish Release
      if: startsWith(github.ref, 'refs/tags/') && env.IS_STABLE == 'true'
      uses: ncipollo/release-action@v1
      with:
        artifacts: "artifacts/*.bin,artifacts/*.elf.gz"
        allowUpdates: true
        artifactErrorsFailBuild: true
        generateReleaseNotes: true
        replacesArtifacts: true


